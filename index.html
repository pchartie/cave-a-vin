<!DOCTYPE html>
<html lang="fr" data-design="sommelier">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma Cave</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // Thème appliqué avant l'affichage pour éviter un flash
  const t = localStorage.getItem('theme');
  if (t) document.documentElement.dataset.theme = t;
</script>
<style>
  :root {
    color-scheme: light;
    --bordeaux: #6d1a2c;
    --bordeaux-clair: #8e2a40;
    --accent: #6d1a2c;
    --entete: #6d1a2c;
    --fond: #f7f3ee;
    --carte: #ffffff;
    --texte: #2b2024;
    --gris: #6f6568;
    --muted: #898781;
    --bord: #e4dcd5;
    --survol: #f3e9ec;
    --doux: #faf7f4;
    --rouge: #b3261e;
    /* Graphiques */
    --grille: #e1e0d9;
    --axe: #c3c2b7;
    --s1: #2a78d6;
    --s1-doux: rgba(42,120,214,.12);
    --neutre: #c3c2b7;
    --c-rouge: #6250d6;
    --c-rose: #e87ba4;
    --c-blanc: #eda100;
    --c-bulles: #1baf7a;
    --c-liquoreux: #eb6834;
    --c-autre: #a8a69e;
    /* Statuts */
    --ok: #0ca30c;
    --attention: #fab219;
    --serieux: #ec835a;
    --critique: #d03b3b;
    --b-jeune-fd: #e8f0fb; --b-jeune: #1c5cab;
    --b-apogee-fd: #e3f4ea; --b-apogee: #006300;
    --b-passe-fd: #fbe9e7; --b-passe: #a82a22;
    --b-bas-fd: #fdf0dc; --b-bas: #8a5300;
    --b-inconnu-fd: #eeeeec; --b-inconnu: #6f6568;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --accent: #d0738a; --entete: #4a1220; --bordeaux-clair: #5e1a2b;
      --fond: #0d0d0d; --carte: #1a1a19; --texte: #f0efec; --gris: #c3c2b7; --muted: #898781;
      --bord: #2c2c2a; --survol: #2a2124; --doux: #222220;
      --grille: #2c2c2a; --axe: #383835; --s1: #3987e5; --s1-doux: rgba(57,135,229,.18); --neutre: #4a4a46;
      --c-rouge: #9085e9; --c-rose: #d55181; --c-blanc: #c98500; --c-bulles: #199e70; --c-liquoreux: #d95926; --c-autre: #6e6d68;
      --b-jeune-fd: #1b2a40; --b-jeune: #86b6ef;
      --b-apogee-fd: #15301d; --b-apogee: #5fd35f;
      --b-passe-fd: #3a1b19; --b-passe: #f08c84;
      --b-bas-fd: #3a2b10; --b-bas: #fab219;
      --b-inconnu-fd: #2c2c2a; --b-inconnu: #c3c2b7;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --accent: #d0738a; --entete: #4a1220; --bordeaux-clair: #5e1a2b;
    --fond: #0d0d0d; --carte: #1a1a19; --texte: #f0efec; --gris: #c3c2b7; --muted: #898781;
    --bord: #2c2c2a; --survol: #2a2124; --doux: #222220;
    --grille: #2c2c2a; --axe: #383835; --s1: #3987e5; --s1-doux: rgba(57,135,229,.18); --neutre: #4a4a46;
    --c-rouge: #9085e9; --c-rose: #d55181; --c-blanc: #c98500; --c-bulles: #199e70; --c-liquoreux: #d95926; --c-autre: #6e6d68;
    --b-jeune-fd: #1b2a40; --b-jeune: #86b6ef;
    --b-apogee-fd: #15301d; --b-apogee: #5fd35f;
    --b-passe-fd: #3a1b19; --b-passe: #f08c84;
    --b-bas-fd: #3a2b10; --b-bas: #fab219;
    --b-inconnu-fd: #2c2c2a; --b-inconnu: #c3c2b7;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .ico-bouteille { width: 1.45em; height: 1.45em; vertical-align: -0.38em; margin: 0 -0.12em 0 -0.15em; }
  mark { background: #ffe066; color: inherit; border-radius: 3px; padding: 0 1px; }
  :root[data-theme="dark"] mark { background: #7a5c00; }
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) mark { background: #7a5c00; } }
  .extrait { font-size: .82rem; color: var(--gris); font-style: italic; margin-top: 2px; font-weight: normal; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fond); color: var(--texte);
  }
  header {
    background: var(--entete); color: #fff; padding: 14px 24px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px; justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 1.45rem; font-weight: 600; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
  .stat { text-align: right; }
  .stat .v { font-size: 1.25rem; font-weight: 700; }
  .stat .l { font-size: .72rem; opacity: .8; text-transform: uppercase; letter-spacing: .05em; }
  .btn-theme { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); padding: 6px 10px; font-size: 1rem; }
  .btn-theme:hover { background: rgba(255,255,255,.22); }

  nav.onglets { display: flex; gap: 4px; padding: 0 24px; background: var(--entete); overflow-x: auto; }
  nav.onglets button {
    background: none; border: none; border-radius: 8px 8px 0 0; color: rgba(255,255,255,.75);
    padding: 10px 16px; font-size: .95rem; white-space: nowrap;
  }
  nav.onglets button:hover { background: rgba(255,255,255,.08); color: #fff; }
  nav.onglets button.actif { background: var(--fond); color: var(--texte); font-weight: 600; }

  main { max-width: 1280px; margin: 0 auto; padding: 20px; }
  .barre { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
  .barre input, .barre select { padding: 9px 12px; border: 1px solid var(--bord); border-radius: 8px; font-size: .95rem; background: var(--carte); color: var(--texte); }
  .barre input[type=search] { flex: 1; min-width: 200px; }
  button {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--bordeaux); background: var(--bordeaux);
    color: #fff; font-size: .95rem; cursor: pointer; font-family: inherit;
  }
  button:hover { background: var(--bordeaux-clair); }
  button.sec { background: var(--carte); color: var(--accent); border-color: var(--accent); }
  button.sec:hover { background: var(--survol); }
  button.lien { background: none; border: none; color: var(--accent); padding: 4px 6px; font-size: .85rem; }
  button.lien:hover { background: var(--survol); }
  button.danger { background: var(--carte); color: var(--rouge); border-color: var(--rouge); }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--gris); }
  .vue { display: none; }
  .vue.active { display: block; }
  .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

  /* Éléments communs */
  .sous { color: var(--gris); font-size: .85rem; }
  .pastille { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex-shrink: 0; }
  .badge { font-size: .72rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .b-jeune { background: var(--b-jeune-fd); color: var(--b-jeune); }
  .b-apogee { background: var(--b-apogee-fd); color: var(--b-apogee); }
  .b-passe { background: var(--b-passe-fd); color: var(--b-passe); }
  .b-bas { background: var(--b-bas-fd); color: var(--b-bas); }
  .b-inconnu { background: var(--b-inconnu-fd); color: var(--b-inconnu); }
  .vide { text-align: center; color: var(--gris); padding: 60px 20px; }


  /* Vue lignes */
  .tableau-wrap { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; overflow: auto; max-height: calc(100vh - 260px); }
  table.lignes { width: 100%; border-collapse: collapse; font-size: .9rem; }
  table.lignes th {
    position: sticky; top: 0; background: var(--carte); text-align: left; font-weight: 600; color: var(--gris);
    padding: 10px 10px; border-bottom: 1px solid var(--bord); cursor: pointer; user-select: none; white-space: nowrap; font-size: .8rem;
  }
  table.lignes th:hover { color: var(--texte); }
  table.lignes th.num { text-align: right; }
  table.lignes th .fleche { color: var(--accent); }
  table.lignes td { padding: 8px 10px; border-bottom: 1px solid var(--bord); vertical-align: middle; }
  table.lignes tbody tr { cursor: pointer; }
  table.lignes tbody tr:hover { background: var(--survol); }
  table.lignes tbody tr.epuise { opacity: .55; }
  table.lignes tfoot td { position: sticky; bottom: 0; background: var(--doux); font-weight: 600; border-top: 1px solid var(--bord); border-bottom: none; }
  .vignette { width: 32px; height: 32px; border-radius: 6px; background: var(--doux) center/cover no-repeat; display: inline-block; vertical-align: middle; }
  .vignette.photo-ok, .grande-photo.photo-ok { cursor: zoom-in; }
  .vignette.photo-ok:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
  #visionneuse { position: fixed; inset: 0; z-index: 1000; background: rgba(10,5,8,.88); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; cursor: zoom-out; }
  #visionneuse.ouvert { display: flex; }
  #visionneuse img { max-width: 94vw; max-height: calc(100vh - 90px); object-fit: contain; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #visionneuse .legende-photo { color: #fff; font-size: .95rem; opacity: .9; }
  #visionneuse .fermer { color: #fff; top: 14px; right: 18px; }
  #visionneuse .fermer:hover { background: rgba(255,255,255,.15); }

  /* Tableau de bord */
  .db-haut { display: grid; grid-template-columns: minmax(260px, 1.4fr) repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .tuile { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .tuile .l { font-size: .82rem; color: var(--gris); }
  .tuile .v { font-size: 1.7rem; font-weight: 600; }
  .tuile .d { font-size: .8rem; color: var(--muted); }
  .tuile.hero .v { font-size: 3.2rem; line-height: 1.05; }
  .tuile .statut { display: inline-flex; align-items: center; gap: 6px; }
  .tuile .statut i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .7rem; color: #fff; font-weight: 700; }
  .tuile.cliquable { cursor: pointer; }
  .tuile.cliquable:hover { border-color: var(--accent); }
  .db-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 16px; }
  .graph { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  .graph .tete { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .graph h3 { margin: 0; font-size: 1rem; font-weight: 600; }
  .graph .st { font-size: .8rem; color: var(--gris); margin-top: 2px; }
  .graph svg { width: 100%; height: auto; display: block; overflow: visible; }
  .graph svg text { font-family: inherit; }
  .graph .t-axe { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .graph .t-lab { fill: var(--gris); font-size: 12px; }
  .graph .t-val { fill: var(--texte); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .graph .grille-l { stroke: var(--grille); stroke-width: 1; }
  .graph .axe-l { stroke: var(--axe); stroke-width: 1; }
  .graph .m .barre-m { transition: opacity .12s; }
  .graph svg:hover .m:not(:hover) .barre-m { opacity: .45; }
  .graph .hit { fill: transparent; cursor: default; outline: none; }
  .graph .hit.clic { cursor: pointer; }
  .graph .hit:focus-visible { stroke: var(--accent); stroke-width: 2; }
  .graph .vide-g { color: var(--muted); font-size: .9rem; padding: 30px 0; text-align: center; }
  .legende { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--gris); margin-top: 10px; }
  .legende span { display: inline-flex; align-items: center; }
  .legende .cle { width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .rep-couleur { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px 16px; margin-top: 12px; }
  .rep-couleur div { display: flex; align-items: center; gap: 6px; font-size: .88rem; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  .rep-couleur div:hover { background: var(--survol); }
  .rep-couleur b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .rep-couleur small { color: var(--muted); min-width: 40px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.donnees { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 8px; }
  table.donnees th, table.donnees td { padding: 5px 8px; border-bottom: 1px solid var(--bord); text-align: left; }
  table.donnees th { color: var(--gris); font-weight: 600; }
  .prio { list-style: none; margin: 0; padding: 0; }
  .prio li { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--bord); cursor: pointer; font-size: .9rem; border-radius: 6px; }
  .prio li:hover { background: var(--survol); }
  .prio li:last-child { border-bottom: none; }
  .prio .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Carte des vins */
  .carte-wrap { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
  .carte-svg { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 14px; }
  .carte-svg svg { width: 100%; height: auto; display: block; }
  .carte-svg .dep, .carte-svg .reg, .carte-svg .pays, .carte-svg .app { vector-effect: non-scaling-stroke; }
  .carte-svg .dep.estompe { opacity: .35; }
  .carte-svg .app { fill: var(--s1); stroke: var(--carte); stroke-width: 2; cursor: pointer; outline: none; }
  .carte-svg .app:hover, .carte-svg .app:focus-visible { fill: color-mix(in srgb, var(--s1) 75%, var(--texte)); }
  .carte-svg .app.sel { stroke: var(--texte); stroke-width: 2.5; }
  .carte-svg .dep { stroke: var(--carte); stroke-width: .4; stroke-linejoin: round; transition: opacity .12s; }
  .carte-svg .dep.hors { fill: color-mix(in srgb, var(--neutre) 14%, var(--carte)); }
  .carte-svg .reg { fill: none; stroke: var(--carte); stroke-width: 1.8; stroke-linejoin: round; pointer-events: none; }
  .carte-svg .reg.sel { stroke: var(--texte); stroke-width: 1.3; }
  .carte-svg .pays { fill: none; stroke: var(--axe); stroke-width: .8; stroke-linejoin: round; pointer-events: none; }
  .carte-svg .dep.vin { cursor: pointer; }
  .carte-svg svg.focus .dep.vin:not(.actif) { opacity: .4; }
  .carte-svg .etiq { pointer-events: none; paint-order: stroke; stroke: var(--carte); stroke-width: 3px; stroke-linejoin: round; }
  .carte-svg .etiq .n1 { font-size: 12px; font-weight: 600; fill: var(--texte); }
  .carte-svg .etiq .n2 { font-size: 10.5px; fill: var(--gris); font-variant-numeric: tabular-nums; }
  .carte-svg .etiq.vide-r .n1 { fill: var(--muted); font-weight: 500; }
  .carte-svg .etiq.etiq-app .n1 { font-size: 1em; font-weight: 600; }
  .carte-svg .etiq.etiq-app .n2 { font-size: .9em; font-weight: 400; }
  .carte-svg .rappel { stroke: var(--gris); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }
  .degrade { width: 120px; height: 10px; border-radius: 3px; display: inline-block; margin: 0 6px; background: linear-gradient(90deg, color-mix(in srgb, var(--s1) 20%, var(--carte)), var(--s1)); }
  .carte-panneau { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .carte-panneau .graph { padding: 14px 16px; }
  table.regions { width: 100%; border-collapse: collapse; font-size: .88rem; }
  table.regions th { text-align: left; color: var(--gris); font-weight: 600; font-size: .78rem; padding: 6px 6px; border-bottom: 1px solid var(--bord); }
  table.regions td { padding: 6px 6px; border-bottom: 1px solid var(--bord); }
  table.regions tbody tr { cursor: pointer; outline: none; }
  table.regions tbody tr:hover, table.regions tbody tr:focus-visible { background: var(--survol); }
  table.regions tbody tr.sel { background: var(--survol); box-shadow: inset 3px 0 0 var(--accent); }
  table.regions tr.zero td { color: var(--muted); }
  @media (max-width: 900px) { .carte-wrap { grid-template-columns: 1fr; } }

  /* Historique */
  .hist-tuiles { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .hist-mois { margin-bottom: 20px; }
  .hist-mois h3 { font-size: 1rem; margin: 0 0 8px; text-transform: capitalize; }
  .hist-mois h3 .sous { text-transform: none; font-weight: 400; }
  .hist { display: flex; gap: 14px; background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; outline: none; }
  .hist:hover, .hist:focus-visible { border-color: var(--accent); }
  .hist-date { width: 44px; flex-shrink: 0; text-align: center; display: flex; flex-direction: column; color: var(--gris); font-size: .75rem; }
  .hist-date b { font-size: 1.4rem; color: var(--texte); font-weight: 600; line-height: 1.1; }
  .hist-corps { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .hist-tete { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .hist-tete .pastille { margin-right: 0; }
  .hist-tete .etoiles { margin-left: auto; }
  .hist-com { white-space: pre-wrap; font-size: .92rem; line-height: 1.45; }
  .hist-suppr { align-self: flex-start; flex-shrink: 0; background: none; border: none; padding: 6px; margin: -4px -6px 0 0; border-radius: 8px; color: var(--muted); line-height: 0; cursor: pointer; }
  .hist-suppr:hover, .hist-suppr:focus-visible { background: var(--b-passe-fd); color: var(--b-passe); }
  .hist-suppr svg { width: 18px; height: 18px; }

  /* Fenêtre de confirmation */
  body.modale-ouverte { overflow: hidden; }
  #m-confirm { align-items: center; }
  #m-confirm .modale-confirm { max-width: 420px; text-align: center; padding: 28px 26px 22px; }
  .modale-confirm h2 { margin: 12px 0 8px; padding: 0; font-size: 1.2rem; color: var(--texte); }
  .modale-confirm p { margin: 0; color: var(--gris); white-space: pre-line; line-height: 1.5; font-size: .95rem; }
  .modale-confirm .actions { justify-content: center; margin-top: 22px; }
  .modale-confirm .actions button { min-width: 120px; }
  .confirm-icone { width: 52px; height: 52px; margin: 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .confirm-icone svg { width: 26px; height: 26px; }
  .confirm-icone.danger { background: var(--b-passe-fd); color: var(--b-passe); }
  .confirm-icone.info { background: var(--b-jeune-fd); color: var(--b-jeune); }
  button.btn-danger { background: #b3261e; border-color: #b3261e; color: #fff; }
  button.btn-danger:hover { background: #8f1d17; border-color: #8f1d17; }

  /* Animations des fenêtres (ouverture / fermeture) */
  @keyframes fondApparait { from { opacity: 0; } }
  @keyframes fondDisparait { to { opacity: 0; } }
  @keyframes fenetreApparait { from { opacity: 0; transform: translateY(16px) scale(.97); } }
  @keyframes fenetreDisparait { to { opacity: 0; transform: translateY(22px) scale(.94); } }
  @keyframes confirmApparait { 0% { opacity: 0; transform: scale(.82); } 65% { opacity: 1; transform: scale(1.035); } 100% { transform: none; } }
  @keyframes confirmSeRetracte { to { opacity: 0; transform: scale(.86); } }
  @keyframes confirmTombe {
    0% { transform: none; }
    22% { transform: translateY(-8px) rotate(-1.5deg); }
    100% { opacity: 0; transform: translateY(90px) rotate(6deg) scale(.9); }
  }
  @keyframes corbeilleSecoue { 0%, 100% { transform: none; } 20% { transform: rotate(-14deg); } 40% { transform: rotate(11deg); } 60% { transform: rotate(-7deg); } 80% { transform: rotate(3deg); } }
  @keyframes photoApparait { from { opacity: 0; transform: scale(.9); } }
  @keyframes photoDisparait { to { opacity: 0; transform: scale(.82); } }
  @keyframes ligneDisparait {
    35% { opacity: 0; transform: translateX(48px); }
    100% { opacity: 0; transform: translateX(64px); max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; border-width: 0; }
  }
  .fond-modale.ouvert { animation: fondApparait .22s ease-out; }
  .fond-modale.ouvert > .modale { animation: fenetreApparait .3s cubic-bezier(.2, .9, .3, 1.1); }
  .fond-modale.fermeture { animation: fondDisparait .24s ease-in forwards; pointer-events: none; }
  .fond-modale.fermeture > .modale { animation: fenetreDisparait .22s ease-in forwards; }
  #m-confirm.ouvert > .modale { animation: confirmApparait .34s cubic-bezier(.2, .9, .3, 1.2); }
  #m-confirm.ouvert .confirm-icone.danger svg { animation: corbeilleSecoue .6s .18s ease-in-out; }
  #m-confirm.fermeture > .modale { animation: confirmSeRetracte .2s ease-in forwards; }
  #m-confirm.fermeture.validee { animation-duration: .34s; }
  #m-confirm.fermeture.validee > .modale { animation: confirmTombe .34s cubic-bezier(.5, 0, .75, 0) forwards; }
  #visionneuse.ouvert { animation: fondApparait .2s ease-out; }
  #visionneuse.ouvert img { animation: photoApparait .28s cubic-bezier(.2, .9, .3, 1.1); }
  #visionneuse.fermeture { animation: fondDisparait .24s ease-in forwards; pointer-events: none; }
  #visionneuse.fermeture img { animation: photoDisparait .22s ease-in forwards; }
  .hist.disparition, .sortie.disparition { animation: ligneDisparait .4s ease-in forwards; overflow: hidden; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    .fond-modale, .fond-modale > .modale, #visionneuse, #visionneuse img, .hist, .sortie, .confirm-icone svg { animation: none !important; }
  }

  /* Listes déroulantes personnalisées (la vraie liste <select> reste cachée derrière) */
  .liste-native { display: none !important; }
  .liste { position: relative; display: inline-flex; vertical-align: middle; }
  form .liste { display: flex; }
  .liste-bouton {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-width: 10.5em;
    padding: 9px 12px; border: 1px solid var(--bord); border-radius: 10px; background: var(--carte); color: var(--texte);
    font: inherit; font-size: .95rem; text-align: left; cursor: pointer; transition: border-color .15s;
  }
  form .liste-bouton { min-width: 0; padding: 9px 10px; }
  .liste-bouton:hover { background: var(--carte); border-color: color-mix(in srgb, var(--accent) 45%, var(--bord)); }
  .liste.ouverte .liste-bouton, .liste-bouton:focus-visible { border-color: var(--accent); outline: 2px solid color-mix(in srgb, var(--accent) 30%, transparent); outline-offset: 1px; }
  .liste-valeur { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .liste-chevron { width: 16px; height: 16px; flex-shrink: 0; color: var(--muted); transition: transform .2s ease; }
  .liste.ouverte .liste-chevron { transform: rotate(180deg); color: var(--accent); }
  .liste-menu {
    position: absolute; left: 0; top: calc(100% + 6px); z-index: 60; min-width: 100%; max-height: 300px; overflow: auto;
    background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 6px; outline: none;
    box-shadow: 0 14px 36px rgba(36,16,22,.18), 0 2px 6px rgba(36,16,22,.06); display: none; transform-origin: top center;
  }
  .liste.vers-le-haut .liste-menu { top: auto; bottom: calc(100% + 6px); transform-origin: bottom center; }
  .liste.ouverte .liste-menu { display: block; animation: listeApparait .17s cubic-bezier(.2, .9, .3, 1.1); }
  .liste.fermeture .liste-menu { display: block; animation: listeDisparait .12s ease-in forwards; pointer-events: none; }
  @keyframes listeApparait { from { opacity: 0; transform: translateY(-6px) scale(.96); } }
  @keyframes listeDisparait { to { opacity: 0; transform: translateY(-4px) scale(.97); } }
  .liste-option { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: .93rem; }
  .liste-option.active { background: var(--survol); }
  .liste-option.sel { color: var(--accent); font-weight: 600; }
  .liste-option .coche { margin-left: auto; padding-left: 16px; display: flex; visibility: hidden; }
  .liste-option .coche svg { width: 15px; height: 15px; }
  .liste-option.sel .coche { visibility: visible; }
  .liste .pastille { margin: 0; }
  @media (max-width: 600px) {
    .barre .liste { flex: 1 1 40%; min-width: 0; }
    .barre .liste-bouton { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .liste-menu { animation: none !important; } .liste-chevron { transition: none; } }

  /* Formulaire d'ajout / modification d'un vin */
  /* La fenêtre ne dépasse jamais la hauteur de l'écran : en-tête et boutons fixes, seul le contenu défile */
  #m-form { align-items: center; padding: 16px 12px; }
  #m-form .modale-form { max-width: 1080px; padding: 0; overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); }
  #form-vin { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #form-vin .form-grille { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .form-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; border-bottom: 1px solid var(--bord); }
  .form-duo fieldset { border-bottom: none !important; }
  /* Écrans d'ordinateur portable et plus : champs sur 4 colonnes */
  @media (min-width: 1000px) {
    .form-sections > fieldset > .champs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    /* Appellation plus large ; Région, Millésime et Degré resserrés */
    .form-sections > fieldset.section-vin > .champs { grid-template-columns: minmax(0, 2.3fr) minmax(0, 1.3fr) minmax(0, .9fr) minmax(0, 1fr); }
    .form-grille { grid-template-columns: 210px minmax(0, 1fr); }
  }
  /* Écrans très bas (1280 × 700 environ) : Notes un peu moins hautes, sections plus serrées */
  @media (max-height: 760px) {
    #m-form #form-vin textarea { min-height: 76px; height: 76px; }
    #m-form .form-sections > * + * { margin-top: 2px; }
    #m-form .form-grille { padding-bottom: 14px; }
  }
  /* Écrans peu hauts (portable 14 pouces avec barres du navigateur et de Windows) : tout se resserre */
  @media (max-height: 900px) {
    .form-grille { padding-top: 18px; padding-bottom: 16px; }
    .form-sections legend { padding: 4px 0 6px; }
    .form-sections fieldset { padding-bottom: 10px; }
    .form-sections .champs { gap: 8px 14px; }
    #form-vin input, #form-vin textarea { padding-top: 7px !important; padding-bottom: 7px !important; }
    .champ-nom { padding-top: 8px !important; padding-bottom: 8px !important; }
    #form-vin textarea { min-height: 84px; height: 84px; }
    .form-cote { gap: 8px; }
    .form-champ { margin-top: 2px; gap: 6px; }
    .aide { font-size: .7rem; }
    #form-vin .zone-photo { aspect-ratio: 1 / 1; }
  }
  .form-grille { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 26px; padding: 24px 28px 22px; }
  .form-cote { display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
  .zone-photo {
    position: relative; display: block; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; cursor: pointer;
    border: 2px dashed color-mix(in srgb, var(--accent) 35%, var(--bord)); background: var(--doux); transition: border-color .15s, background .15s;
  }
  .zone-photo:hover, .zone-photo.survol { border-color: var(--accent); background: var(--survol); }
  .zone-photo input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .zone-photo .apercu-photo { position: absolute; inset: 0; width: auto; height: auto; border: none; border-radius: 0; background: center / cover no-repeat; }
  .zone-photo-vide { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--gris); text-align: center; padding: 14px; }
  .zone-photo-vide svg { width: 38px; height: 38px; color: var(--accent); opacity: .8; margin-bottom: 4px; }
  .zone-photo-vide b { color: var(--texte); font-size: .92rem; }
  .zone-photo-vide small { font-size: .78rem; }
  .zone-photo-changer {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 10px; text-align: center; font-size: .82rem; font-weight: 600; color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.65)); opacity: 0; transition: opacity .15s;
  }
  .zone-photo.a-photo { border-style: solid; border-color: transparent; }
  .zone-photo.a-photo .zone-photo-vide { display: none; }
  .zone-photo.a-photo:hover .zone-photo-changer { opacity: 1; }
  #btn-retirer-photo { align-self: center; }
  .form-champ { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .form-notes textarea { width: 100%; min-height: 110px; resize: vertical; }
  .form-libelle { font-size: .85rem; color: var(--gris); }
  .choix-couleur { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .choix-couleur label { cursor: pointer; }
  .choix-couleur input { position: absolute; opacity: 0; pointer-events: none; }
  .choix-couleur span {
    display: flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid var(--bord); border-radius: 999px;
    font-size: .86rem; color: var(--texte); background: var(--carte); transition: border-color .15s, background .15s;
  }
  .choix-couleur span i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .choix-couleur label:hover span { border-color: color-mix(in srgb, var(--accent) 45%, var(--bord)); }
  .choix-couleur input:checked + span { border-color: var(--accent); background: var(--survol); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
  .choix-couleur input:focus-visible + span { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 1px; }
  /* Mise en page classique (pas flex) : WebKit surestime la hauteur des <fieldset> dans une colonne flex */
  .form-sections { display: block; min-width: 0; }
  .form-sections > * + * { margin-top: 6px; }
  .form-sections fieldset { border: none; margin: 0; padding: 0 0 14px; border-bottom: 1px solid var(--bord); }
  .form-sections fieldset:last-child { border-bottom: none; padding-bottom: 6px; }
  .form-sections legend { padding: 8px 0 10px; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .form-sections .champs { gap: 12px 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-sections fieldset { min-width: 0; }   /* un fieldset ne rétrécit pas sous son contenu par défaut */
  .champ-nom { font-size: 1.1rem !important; font-weight: 600; padding: 11px 12px !important; }
  .avec-unite { position: relative; display: flex; }
  .avec-unite input { flex: 1; min-width: 0; padding-right: 64px !important; }
  .avec-unite i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: .82rem; color: var(--muted); pointer-events: none; }
  .aide { font-size: .74rem; color: var(--muted); }
  /* Pas de flèches + / − natives dans le formulaire (elles se collaient aux unités) */
  #form-vin input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  #form-vin input[type=number]::-webkit-inner-spin-button, #form-vin input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .visuellement-cache { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* Boutons en bas de la colonne de gauche, alignés sur le bas du formulaire */
  .form-actions { margin-top: auto; padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .form-actions button { width: 100%; padding: 11px 16px; font-size: 1rem; }
  @media (max-width: 760px) {
    .form-duo { grid-template-columns: 1fr; }
    .form-duo fieldset:first-child { border-bottom: 1px solid var(--bord) !important; }
    .form-grille { grid-template-columns: 1fr; gap: 16px; padding: 16px 18px 6px; }
    .form-cote { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: start; }
    .form-cote .zone-photo { grid-row: span 2; }
    .zone-photo-vide small { display: none; }
    #btn-retirer-photo { grid-column: 1; align-self: start; }
    .form-champ { margin-top: 0; grid-column: 2; grid-row: 1 / span 2; }
    .form-cote { display: contents; }
    .form-grille { grid-template-columns: 120px 1fr; }
    .form-cote .zone-photo { grid-column: 1; grid-row: 1 / span 2; }
    .form-sections { grid-column: 1 / -1; }
    .form-actions { grid-column: 1 / -1; order: 99; position: sticky; bottom: 0; flex-direction: row-reverse; padding: 10px 0; background: var(--carte); }
  }

  /* Infobulle */
  #tip {
    position: fixed; z-index: 50; pointer-events: none; background: var(--carte); color: var(--texte);
    border: 1px solid var(--bord); border-radius: 8px; padding: 8px 10px; font-size: .82rem; line-height: 1.4;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); white-space: pre-line; max-width: 280px; display: none;
  }
  #tip.vis { display: block; }
  #tip::first-line { font-weight: 600; }

  /* Modales */
  .fond-modale { position: fixed; inset: 0; background: rgba(20,10,14,.55); display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 30px 12px; z-index: 10; }
  .fond-modale.ouvert { display: flex; }
  .modale { background: var(--carte); border-radius: 14px; width: 100%; max-width: 760px; padding: 24px; position: relative; }
  .modale h2 { margin-top: 0; color: var(--accent); padding-right: 30px; }
  .fermer { position: absolute; top: 12px; right: 14px; background: none; border: none; color: var(--gris); font-size: 1.6rem; padding: 4px 10px; }
  .fermer:hover { background: var(--survol); }
  form .champs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  form .plein { grid-column: 1 / -1; }
  form label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--gris); }
  form input, form select, form textarea { padding: 9px 10px; border: 1px solid var(--bord); border-radius: 8px; font-size: .95rem; color: var(--texte); background: var(--carte); font-family: inherit; }
  form textarea { resize: vertical; min-height: 70px; }
  .duo { display: flex; gap: 8px; align-items: center; }
  .duo input { flex: 1; min-width: 0; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .apercu-photo { width: 120px; height: 120px; border-radius: 8px; background: var(--doux) center/cover no-repeat; border: 1px solid var(--bord); }
  .detail-tete { display: flex; gap: 20px; flex-wrap: wrap; }
  .detail-tete .grande-photo { width: 220px; height: 280px; border-radius: 10px; background: var(--doux) center/contain no-repeat; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 4rem; color: var(--muted); }
  .infos { flex: 1; min-width: 260px; }
  .infos table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .infos td { padding: 5px 0; border-bottom: 1px solid var(--bord); }
  .infos td:first-child { color: var(--gris); width: 45%; }
  .sorties { margin-top: 22px; }
  .sortie { border-left: 3px solid var(--accent); padding: 8px 12px; margin-bottom: 10px; background: var(--doux); border-radius: 0 8px 8px 0; }
  .sortie .entete { display: flex; justify-content: space-between; font-size: .85rem; color: var(--gris); gap: 8px; }
  .etoiles { color: #d4a017; letter-spacing: 2px; }
  .choix-etoiles { display: flex; gap: 4px; font-size: 1.8rem; cursor: pointer; user-select: none; }
  .choix-etoiles span { color: var(--bord); }
  .choix-etoiles span.on { color: #d4a017; }
  .suppr-sortie { background: none; border: none; color: var(--gris); padding: 0 4px; font-size: .9rem; }
  .suppr-sortie:hover { background: none; color: var(--rouge); }

  @media (max-width: 700px) {
    form .champs { grid-template-columns: 1fr; }
    .detail-tete .grande-photo { width: 100%; }
    header, nav.onglets { padding-left: 12px; padding-right: 12px; }
    main { padding: 12px; }
    .stat { text-align: left; }
    .db-grille { grid-template-columns: 1fr; }
    .db-haut { grid-template-columns: 1fr 1fr; }
    .tuile.hero { grid-column: 1 / -1; }
  }
  /* =====================================================================
     Design « Sommelier » : uniquement du visuel (couleurs, agencement).
     Activé par <html data-design="sommelier">, bouton 🎨 pour revenir au design classique.
     Les couleurs des graphiques ne changent pas (palette vérifiée).
     ===================================================================== */
  :root[data-design="sommelier"] {
    --fond: #f4efe8; --carte: #fffdfa; --texte: #241a1d; --gris: #6b5f62; --muted: #8b8480;
    --bord: #e9e1d7; --survol: #f6ede9; --doux: #f8f3ed;
    --accent: #7b1e34; --bordeaux: #7b1e34; --bordeaux-clair: #932a43; --entete: #241016; --or: #c8a45c;
    --ombre: 0 1px 2px rgba(36,16,22,.06), 0 6px 20px rgba(36,16,22,.06);
    --largeur-menu: 236px;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-design="sommelier"]:where(:not([data-theme="light"])) {
      --fond: #110d0e; --carte: #1b1718; --texte: #f2ece6; --gris: #c4b9b2; --bord: #2e2729; --survol: #2a2023; --doux: #221d1e;
      --accent: #e0a3b2; --bordeaux: #8e2a43; --bordeaux-clair: #a3354f; --entete: #0b0708; --ombre: none;
    }
  }
  :root[data-design="sommelier"][data-theme="dark"] {
    --fond: #110d0e; --carte: #1b1718; --texte: #f2ece6; --gris: #c4b9b2; --bord: #2e2729; --survol: #2a2023; --doux: #221d1e;
    --accent: #e0a3b2; --bordeaux: #8e2a43; --bordeaux-clair: #a3354f; --entete: #0b0708; --ombre: none;
  }

  /* Agencement : menu latéral sombre à gauche, contenu à droite */
  [data-design="sommelier"] body {
    display: grid; grid-template-columns: var(--largeur-menu) minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100vh;
    background: linear-gradient(90deg, var(--entete) var(--largeur-menu), var(--fond) var(--largeur-menu));
  }
  [data-design="sommelier"] header {
    grid-column: 1; grid-row: 1; background: transparent; flex-direction: column; align-items: stretch;
    justify-content: flex-start; gap: 20px; padding: 28px 20px 12px;
  }
  [data-design="sommelier"] header h1 { font-size: 1.3rem; letter-spacing: .01em; }
  [data-design="sommelier"] header h1::after {
    content: "Livre de cave"; display: block; margin-top: 6px; font-size: .66rem; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase; color: var(--or);
  }
  [data-design="sommelier"] .stats { flex-direction: row; flex-wrap: wrap; gap: 0 8px; }
  [data-design="sommelier"] .stat {
    flex-basis: 100%; display: flex; justify-content: space-between; align-items: baseline; text-align: left;
    padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.08);
  }
  [data-design="sommelier"] .stat .l { order: 1; font-size: .66rem; opacity: .6; }
  [data-design="sommelier"] .stat .v { order: 2; font-size: 1rem; font-weight: 600; }
  [data-design="sommelier"] .btn-theme { margin-top: 12px; border-radius: 8px; background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); }
  @media (min-width: 901px) {
    [data-design="sommelier"] #btn-theme {
      position: fixed; left: 16px; bottom: 18px; z-index: 4; width: calc(var(--largeur-menu) - 32px); margin: 0;
      display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px;
      font-size: .88rem; color: rgba(255,255,255,.78); text-align: left;
    }
    [data-design="sommelier"] #btn-theme:hover { color: #fff; background: rgba(255,255,255,.1); }
    /* le menu ne passe pas sous le bouton */
    [data-design="sommelier"] nav.onglets { padding-bottom: 90px; }
  }
  @media (max-width: 900px) { #btn-theme .libelle { display: none; } }

  [data-design="sommelier"] nav.onglets {
    grid-column: 1; grid-row: 2; align-self: start; position: sticky; top: 0;
    flex-direction: column; gap: 2px; padding: 8px 12px 28px; background: transparent; overflow: visible;
  }
  [data-design="sommelier"] nav.onglets button {
    position: relative; text-align: left; border-radius: 10px; padding: 11px 14px; font-size: .92rem; color: rgba(255,255,255,.68);
  }
  [data-design="sommelier"] nav.onglets button:hover { background: rgba(255,255,255,.06); color: #fff; }
  [data-design="sommelier"] nav.onglets button.actif { background: rgba(255,255,255,.09); color: #fff; font-weight: 600; }
  [data-design="sommelier"] nav.onglets button.actif::before {
    content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--or);
  }

  [data-design="sommelier"] main { grid-column: 2; grid-row: 1 / span 2; width: 100%; max-width: 1380px; margin: 0; padding: 0 36px 56px; }
  /* Barre de recherche collée en haut pendant le défilement */
  [data-design="sommelier"] main > .barre:first-child {
    position: sticky; top: 0; z-index: 5; margin: 0 -36px 22px; padding: 18px 36px 14px;
    background: color-mix(in srgb, var(--fond) 92%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--bord);
  }

  /* Champs et boutons */
  [data-design="sommelier"] .barre input, [data-design="sommelier"] .barre select,
  [data-design="sommelier"] form input, [data-design="sommelier"] form select, [data-design="sommelier"] form textarea {
    border-radius: 10px; border-color: var(--bord); background: var(--carte);

<script>
// ---------- Stockage (IndexedDB, pour supporter les photos) ----------
const DB_NOM = 'ma-cave', STORE = 'vins';
let db;
function ouvrirDB() {
  return new Promise((ok, ko) => {
    const req = indexedDB.open(DB_NOM, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id' });
    req.onsuccess = () => { db = req.result; ok(); };
    req.onerror = () => ko(req.error);
  });
}
function tx(mode, fn) {
  return new Promise((ok, ko) => {
    const t = db.transaction(STORE, mode);
    const r = fn(t.objectStore(STORE));
    t.oncomplete = () => ok(r && r.result);
    t.onerror = () => ko(t.error);
  });
}
const toutLire = () => tx('readonly', s => s.getAll());
const sauver = vin => tx('readwrite', s => s.put(vin));
const supprimer = id => tx('readwrite', s => s.delete(id));

// ---------- Utilitaires ----------
// Couleurs des vins : palette vérifiée (daltonisme + contraste), en clair et en sombre via les variables CSS
const ORDRE_COULEURS = ['Rouge', 'Rosé', 'Blanc', 'Bulles', 'Liquoreux', 'Autre'];
const VAR_COULEUR = { Rouge: '--c-rouge', 'Rosé': '--c-rose', Blanc: '--c-blanc', Bulles: '--c-bulles', Liquoreux: '--c-liquoreux', Autre: '--c-autre' };
const couleurVin = c => `var(${VAR_COULEUR[c] || '--c-autre'})`;
const euro = n => (Number(n) || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const euro0 = n => (Number(n) || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const nb = n => (Number(n) || 0).toLocaleString('fr-FR');
const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '—';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dateFr = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('fr-FR') : '';
const aujourdhui = () => new Date().toISOString().slice(0, 10);
const ANNEE = new Date().getFullYear();
const etoiles = n => '★'.repeat(n || 0) + '☆'.repeat(5 - (n || 0));
const stockDe = v => Number(v.stock) || 0;
const valeur = v => stockDe(v) * (Number(v.prix) || 0);
const $ = s => document.querySelector(s);
const pluriel = (n, mot) => `${nb(n)} ${mot}${Math.abs(n) > 1 ? 's' : ''}`;

function etatApogee(v) {
  const a = Number(v.apogee);
  if (!a) return { cle: 'inconnu', cls: 'b-inconnu', txt: 'Apogée ?' };
  if (ANNEE < a) return { cle: 'jeune', cls: 'b-jeune', txt: 'À garder' };
  if (ANNEE === a) return { cle: 'apogee', cls: 'b-apogee', txt: "À l'apogée" };
  return { cle: 'passe', cls: 'b-passe', txt: 'Apogée passée' };
}
const stockBas = v => stockDe(v) > 0 && v.seuil !== '' && v.seuil != null && stockDe(v) <= Number(v.seuil);
// Date d'achat : texte libre (année seule ou date). Les dates ISO sont affichées à la française.
const dateAchatFr = d => /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? dateFr(d) : (d || '');

// Réduit une image à 1000 px max pour ne pas alourdir la base
function lireImage(fichier) {
  return new Promise((ok, ko) => {
    const lecteur = new FileReader();
    lecteur.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1000, r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = ko;
      img.src = lecteur.result;
    };
    lecteur.onerror = ko;
    lecteur.readAsDataURL(fichier);
  });
}

// ---------- État ----------
let vins = [];
let enEdition = null;      // vin en cours d'édition (ou null pour ajout)
let photoTemp = null;      // photo du formulaire
let vinCourant = null;     // vin affiché dans le détail
let noteSortie = 0;
let vue = localStorage.getItem('vue') || 'dashboard';
let triDesc = false;       // sens du tri (vue lignes : clic sur l'en-tête)

async function recharger() {
  vins = await toutLire();
  afficher();
}

// ---------- Filtres & tri ----------
function remplirSelect(sel, valeurs, libelleTous) {
  const actuel = sel.value;
  sel.innerHTML = `<option value="">${libelleTous}</option>` + valeurs.map(v => `<option>${esc(v)}</option>`).join('');
  sel.value = valeurs.includes(actuel) ? actuel : '';
}
function remplirDatalist(id, valeurs) {
  $(id).innerHTML = valeurs.map(v => `<option value="${esc(v)}">`).join('');
}
const uniques = cle => [...new Set(vins.map(v => v[cle]).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'fr'));

// Filtres communs à toutes les vues (sauf « épuisés », propre aux listes)
function filtrer({ avecEpuises, sansRecherche = false }) {
  const q = sansRecherche ? '' : requete();
  const fc = $('#f-couleur').value, fr = $('#f-region').value;
  const bas = $('#f-bas').checked;
  return vins.filter(v =>
    (avecEpuises || stockDe(v) > 0) &&
    (!bas || stockBas(v)) &&
    (!fc || v.couleur === fc) &&
    (!fr || v.region === fr) &&
    (!q || [v.nom, v.appellation, v.region, v.position, v.lieuAchat, v.millesime, v.couleur,
      v.notes, ...(v.sorties || []).map(s => s.commentaire)]
      .some(x => normaliser(x).includes(q)))
  );
}
// Minuscules et sans accents : « eleve » trouve « élevé »
const normaliser = x => String(x ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const requete = () => normaliser($('#recherche').value.trim());

// Positions (dans le texte d'origine) des passages qui correspondent à la recherche, sans tenir compte des accents
function correspondances(texte, q) {
  const t = String(texte ?? ''), norm = [], origine = [];
  for (let i = 0; i < t.length; i++) for (const c of normaliser(t[i])) { norm.push(c); origine.push(i); }
  const n = norm.join(''), res = [];
  if (!q) return res;
  for (let k = n.indexOf(q); k !== -1; k = n.indexOf(q, k + q.length)) res.push([origine[k], origine[k + q.length - 1] + 1]);
  return res;
}
// Échappe le texte et entoure les passages trouvés de <mark>
function hl(texte, q = requete()) {
  const t = String(texte ?? '');
  let out = '', pos = 0;
  for (const [a, b] of correspondances(t, q)) { out += esc(t.slice(pos, a)) + '<mark>' + esc(t.slice(a, b)) + '</mark>'; pos = b; }
  return out + esc(t.slice(pos));
}
// Si la recherche ne correspond qu'à une note ou un commentaire (invisibles dans les listes), on en montre un extrait
function extrait(v, q = requete()) {
  if (!q) return '';
  const visibles = [v.nom, v.appellation, v.region, v.position, v.millesime, v.couleur];
  if (visibles.some(x => normaliser(x).includes(q))) return '';
  const sources = [['🛒 Acheté chez ', v.lieuAchat], ['📝 ', v.notes],
    ...[...(v.sorties || [])].sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(s => [`💬 ${dateFr(s.date)} : `, s.commentaire])];
  for (const [prefixe, src] of sources) {
    const m = correspondances(src, q)[0];
    if (!m) continue;
    const t = String(src), debut = Math.max(0, m[0] - 40), fin = Math.min(t.length, m[1] + 40);
    return `<div class="extrait">${prefixe}${debut > 0 ? '…' : ''}${hl(t.slice(debut, fin), q)}${fin < t.length ? '…' : ''}</div>`;
  }
  return '';
}
const vide9 = x => (x === '' || x == null) ? null : Number(x);
function comparer(cle) {
  const txt = k => (a, b) => (a[k] || '').localeCompare(b[k] || '', 'fr', { numeric: true });
  // Les valeurs manquantes vont toujours à la fin, quel que soit le sens
  const n = f => (a, b) => {
    const x = f(a), y = f(b);
    if (x == null && y == null) return 0;
    if (x == null) return triDesc ? -1 : 1;
    if (y == null) return triDesc ? 1 : -1;
    return x - y;
  };
  return {
    nom: txt('nom'), region: txt('region'), position: txt('position'),
    appellation: txt('appellation'), couleur: (a, b) => ORDRE_COULEURS.indexOf(a.couleur) - ORDRE_COULEURS.indexOf(b.couleur),
    millesime: n(v => vide9(v.millesime)), apogee: n(v => vide9(v.apogee)), prix: n(v => vide9(v.prix)),
    valeur: n(valeur), stock: n(stockDe),
  }[cle] || txt('nom');
}
function trier(liste) {
  const cmp = comparer($('#f-tri').value);
  return liste.sort((a, b) => triDesc ? -cmp(a, b) : cmp(a, b));
}

// ---------- Graphiques (SVG, sans bibliothèque) ----------
const W = 520;
function ticks(max, n = 4) {
  if (max <= 0) return [0, 1];
  const brut = max / n, p = 10 ** Math.floor(Math.log10(brut));
  let pas = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= brut);
  pas = Math.max(1, pas);
  const haut = Math.ceil(max / pas) * pas, t = [];
  for (let v = 0; v <= haut + 1e-9; v += pas) t.push(Math.round(v * 100) / 100);
  return t;
}
const compact = v => v >= 1000 ? (v / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' k' : nb(v);
// Barre arrondie (4 px) côté valeur, carrée côté base
function barreH(x, y, w, h, r = 4) {
  if (w <= 0) return '';
  r = Math.min(r, w, h / 2);
  return `M${x},${y}h${w - r}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 ${-r},${r}h${-(w - r)}z`;
}
function barreV(x, yBase, w, h, r = 4) {
  if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return `M${x},${yBase}v${-(h - r)}a${r},${r} 0 0 1 ${r},${-r}h${w - 2 * r}a${r},${r} 0 0 1 ${r},${r}v${h - r}z`;
}
const coupe = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const attrTip = t => `data-tip="${esc(t)}" tabindex="0"`;

// Barres horizontales : items [{ label, value, tip, action }]
function grapheBarresH(items, { fmt = nb } = {}) {
  if (!items.length) return '<div class="vide-g">Aucune donnée</div>';
  const lg = 130, droite = 76, rh = 30, ep = 16, H = items.length * rh;
  const max = Math.max(...items.map(i => i.value), 1), plot = W - lg - droite;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    <line class="axe-l" x1="${lg}" x2="${lg}" y1="0" y2="${H}"/>
    ${items.map((it, i) => {
      const y = i * rh, w = Math.max(it.value > 0 ? 2 : 0, it.value / max * plot);
      return `<g class="m">
        <text class="t-lab" x="${lg - 10}" y="${y + rh / 2}" text-anchor="end" dominant-baseline="central">${esc(coupe(it.label, 19))}</text>
        <path class="barre-m" d="${barreH(lg, y + (rh - ep) / 2, w, ep)}" fill="${it.couleur || 'var(--s1)'}"/>
        <text class="t-val" x="${lg + w + 6}" y="${y + rh / 2}" dominant-baseline="central">${esc(fmt(it.value))}</text>
        <rect class="hit ${it.action ? 'clic' : ''}" x="0" y="${y}" width="${W}" height="${rh}" ${attrTip(it.tip)} ${it.action ? `data-action="${esc(it.action)}"` : ''}/>
      </g>`;
    }).join('')}
  </svg>`;
}

// Colonnes : items [{ label, value, tip, couleur }]; etiquette = index de la colonne à étiqueter
function grapheColonnes(items, { fmt = nb, etiquettes = [], marque = null } = {}) {
  if (!items.length || items.every(i => !i.value)) return null;
  const g = 34, haut = 18, bas = 24, Hp = 170, H = haut + Hp + bas;
  const max = Math.max(...items.map(i => i.value), 1), tk = ticks(max), top = tk[tk.length - 1];
  const plot = W - g - 4, slot = plot / items.length, bw = Math.min(24, slot * 0.7);
  const yv = v => haut + Hp - v / top * Hp;
  const pas = Math.ceil(items.length / Math.floor(plot / 38));
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    ${tk.map(t => `<line class="grille-l" x1="${g}" x2="${W}" y1="${yv(t)}" y2="${yv(t)}"/><text class="t-axe" x="${g - 6}" y="${yv(t)}" text-anchor="end" dominant-baseline="central">${compact(t)}</text>`).join('')}
    ${marque != null ? `<line x1="${g + slot * (marque + .5)}" x2="${g + slot * (marque + .5)}" y1="${haut - 6}" y2="${haut + Hp}" stroke="var(--texte)" stroke-width="1" opacity=".35"/>` : ''}
    ${items.map((it, i) => {
      const x = g + slot * i, h = it.value / top * Hp;
      return `<g class="m">
        <path class="barre-m" d="${barreV(x + (slot - bw) / 2, haut + Hp, bw, Math.max(it.value > 0 ? 2 : 0, h))}" fill="${it.couleur || 'var(--s1)'}"/>
        ${etiquettes.includes(i) && it.value ? `<text class="t-val" x="${x + slot / 2}" y="${yv(it.value) - 6}" text-anchor="middle">${esc(fmt(it.value))}</text>` : ''}
        ${i % pas === 0 || i === marque ? `<text class="t-axe" x="${x + slot / 2}" y="${haut + Hp + 16}" text-anchor="middle">${esc(it.label)}</text>` : ''}
        <rect class="hit" x="${x}" y="0" width="${slot}" height="${H}" ${attrTip(it.tip)}/>
      </g>`;
    }).join('')}
    <line class="axe-l" x1="${g}" x2="${W}" y1="${haut + Hp}" y2="${haut + Hp}"/>
  </svg>`;
}

// Barre empilée 100 % (répartition) : items [{ label, value, couleur, tip, action }]
function grapheEmpile(items) {
  const total = items.reduce((s, i) => s + i.value, 0);
  if (!total) return '<div class="vide-g">Aucune donnée</div>';
  const h = 26, gap = 2;
  const visibles = items.filter(i => i.value > 0);
  const dispo = W - gap * (visibles.length - 1);
  let x = 0;
  const segs = visibles.map(it => {
    const w = it.value / total * dispo;
    const s = `<g class="m"><rect class="barre-m" x="${x}" y="0" width="${w}" height="${h}" fill="${it.couleur}"/>
      <rect class="hit ${it.action ? 'clic' : ''}" x="${x}" y="0" width="${w}" height="${h}" ${attrTip(it.tip)} ${it.action ? `data-action="${esc(it.action)}"` : ''}/></g>`;
    x += w + gap;
    return s;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${h}" role="img"><defs><clipPath id="clip-emp"><rect width="${W}" height="${h}" rx="4"/></clipPath></defs><g clip-path="url(#clip-emp)">${segs}</g></svg>`;
}

function tableDonnees(entetes, lignes) {
  return `<table class="donnees"><thead><tr>${entetes.map((h, i) => `<th class="${i ? 'num' : ''}">${h}</th>`).join('')}</tr></thead>
    <tbody>${lignes.map(l => `<tr>${l.map((c, i) => `<td class="${i ? 'num' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
// Carte de graphique avec bascule graphique / tableau
function carteGraph({ id, titre, sousTitre, graphe, legende = '', tableau, plein = false }) {
  return `<div class="graph" ${plein ? 'style="grid-column:1/-1"' : ''} data-graph="${id}">
    <div class="tete"><div><h3>${titre}</h3>${sousTitre ? `<div class="st">${sousTitre}</div>` : ''}</div>
      ${tableau ? `<button class="lien" data-bascule="${id}">Tableau</button>` : ''}</div>
    <div class="g-vue">${graphe}${legende}</div>
    ${tableau ? `<div class="t-vue" hidden>${tableau}</div>` : ''}
  </div>`;
}

// Regroupe et additionne
function grouper(liste, cleFn, valFn) {
  const m = new Map();
  for (const v of liste) { const k = cleFn(v); m.set(k, (m.get(k) || 0) + valFn(v)); }
  return m;
}

  if (parMill.size) {

    const carte = b.closest('.graph'), tv = carte.querySelector('.t-vue'), gv = carte.querySelector('.g-vue');

    b.textContent = montrerTable ? 'Graphique' : 'Tableau';
    return;
  }
  const a = e.target.closest('[data-action]');
  if (a) executer(a.dataset.action);
});
$('#vue-dashboard').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset.action) { e.preventDefault(); executer(e.target.dataset.action); }
});
function executer(action) {
  const [type, ...reste] = action.split(':');
  const arg = reste.join(':');
  if (type === 'vin') return afficherDetail(arg);
  if (type === 'couleur') $('#f-couleur').value = $('#f-couleur').value === arg ? '' : arg;
  if (type === 'region') $('#f-region').value = $('#f-region').value === arg ? '' : arg;
  if (type === 'bas') { $('#f-bas').checked = true; changerVue('lignes'); return; }
  if (type === 'vue') { const [v, tri] = arg.split(':'); if (tri) { $('#f-tri').value = tri; triDesc = false; } changerVue(v); return; }
  afficher();
}

    if (x1 - x0 < mini) { x0 = cx - mini / 2; x1 = cx + mini / 2; }

// Place les noms des appellations sans chevauchement : on mesure chaque nom, puis on essaie
// 8 positions autour du point ; si tout est pris, on éloigne le nom et on le relie au point par un trait.
// Un nom qui ne trouve aucune place est omis (il reste dans l'infobulle et dans le tableau).
function placerEtiquettes(svg, points, k, vb) {
  const groupe = svg.querySelector('.etiqs-app');
  if (!groupe) return;
  const NS = 'http://www.w3.org/2000/svg', fs = 11.5 * k, ecart = 4 * k;
  const boites = points.map(p => [p.x - p.r - k, p.y - p.r - k, p.x + p.r + k, p.y + p.r + k]);
  const horsCadre = b => b[0] < vb[0] + 2 * k || b[1] < vb[1] + 2 * k || b[2] > vb[0] + vb[2] - 2 * k || b[3] > vb[1] + vb[3] - 2 * k;
  const libre = b => !horsCadre(b) && !boites.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);

    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'etiq etiq-app');
    t.setAttribute('dominant-baseline', 'central');
    t.setAttribute('style', `font-size:${fs.toFixed(3)}px; stroke-width:${(3 * k).toFixed(3)}px`);
    t.innerHTML = `<tspan class="n1">${esc(p.nom)}</tspan><tspan class="n2"> · ${p.btl}</tspan>`;
    groupe.appendChild(t);
    let w;
    try { w = t.getBBox().width; } catch { w = 0; }
    if (!w) w = (p.nom.length + String(p.btl).length + 3) * fs * 0.62;  // estimation si la mesure est impossible
    w += 2 * k;

    for (const mult of [1, 2.4, 4]) {

        [p.x + d, p.y, 'start'], [p.x - d, p.y, 'end'], [p.x, p.y - d - h / 2, 'middle'], [p.x, p.y + d + h / 2, 'middle'],
        [p.x + dg, p.y - dg - h / 2, 'start'], [p.x + dg, p.y + dg + h / 2, 'start'], [p.x - dg, p.y - dg - h / 2, 'end'], [p.x - dg, p.y + dg + h / 2, 'end'],
      ];
      for (const [x, y, a] of essais) {
        const x0 = a === 'start' ? x : a === 'end' ? x - w : x - w / 2;
        const b = [x0, y - h / 2, x0 + w, y + h / 2];
        if (libre(b)) { place = { x, y, a, b, rappel: mult > 1 }; break; }
      }
      if (place) break;
    }
    if (!place) { t.remove(); continue; }
    t.setAttribute('x', place.x.toFixed(3)); t.setAttribute('y', place.y.toFixed(3)); t.setAttribute('text-anchor', place.a);
    boites.push(place.b);

      const cx = Math.max(place.b[0], Math.min(p.x, place.b[2])), cy = Math.max(place.b[1], Math.min(p.y, place.b[3]));
      const ang = Math.atan2(cy - p.y, cx - p.x);

      l.setAttribute('x2', cx.toFixed(3)); l.setAttribute('y2', cy.toFixed(3));
      groupe.insertBefore(l, groupe.firstChild);
    }
  }
}

// ---------- Listes déroulantes personnalisées ----------
// Chaque <select> visible est caché et doublé d'une liste aux couleurs de l'app. Le <select> reste la référence :
// sa valeur et ses événements « input » / « change » sont inchangés pour le reste du code.
const SVG_CHEVRON = '<svg class="liste-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const SVG_COCHE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let listeOuverte = null;
function contenuOption(sel, opt) {
  // Pastille de couleur devant Rouge, Blanc, Bulles… dans les listes de couleur
  const couleur = (sel.id === 'f-couleur' || sel.name === 'couleur') && VAR_COULEUR[opt.value];
  return (couleur ? `<span class="pastille" style="background:${couleurVin(opt.value)}"></span>` : '') + `<span>${esc(opt.textContent)}</span>`;
}
function ameliorerListes() {
  document.querySelectorAll('select:not([hidden]):not(.liste-native)').forEach(sel => {
    sel.classList.add('liste-native');
    const w = document.createElement('div');
    w.className = 'liste';
    w.innerHTML = `<button type="button" class="liste-bouton" aria-haspopup="listbox" aria-expanded="false"><span class="liste-valeur"></span>${SVG_CHEVRON}</button>
      <div class="liste-menu" role="listbox" tabindex="-1"></div>`;
    w._select = sel;
    sel.after(w);
    sel.addEventListener('change', () => synchroniserListe(w));
    const bouton = w.querySelector('.liste-bouton'), menu = w.querySelector('.liste-menu');
    bouton.addEventListener('click', () => w.classList.contains('ouverte') ? fermerListe(w) : ouvrirListe(w));
    bouton.addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); ouvrirListe(w); } });
    menu.addEventListener('click', e => { const o = e.target.closest('.liste-option'); if (o) choisirOption(w, +o.dataset.i); });
    menu.addEventListener('pointermove', e => { const o = e.target.closest('.liste-option'); if (o) activerOption(w, +o.dataset.i, false); });
    menu.addEventListener('keydown', e => naviguerListe(e, w));
    synchroniserListe(w);
  });
}
function synchroniserListe(w) {
  const sel = w._select, i0 = sel.selectedIndex;
  w.querySelector('.liste-valeur').innerHTML = i0 >= 0 ? contenuOption(sel, sel.options[i0]) : '';
  w.querySelector('.liste-menu').innerHTML = [...sel.options].map((o, i) =>
    `<div class="liste-option ${i === i0 ? 'sel' : ''}" role="option" aria-selected="${i === i0}" data-i="${i}">${contenuOption(sel, o)}<span class="coche">${SVG_COCHE}</span></div>`).join('');
}
// Après chaque affichage : nouvelles listes à doubler, valeurs à recopier, listes orphelines à retirer
function synchroniserListes() {
  ameliorerListes();
  document.querySelectorAll('.liste').forEach(w => {
    if (!w._select?.isConnected) return w.remove();
    if (w !== listeOuverte) synchroniserListe(w);
  });
}
function ouvrirListe(w) {
  if (listeOuverte && listeOuverte !== w) fermerListe(listeOuverte, true);
  synchroniserListe(w);
  clearTimeout(w._finAnim);
  w.classList.remove('fermeture');
  // Pas assez de place en dessous (et plus au-dessus) : le menu s'ouvre vers le haut
  const r = w.getBoundingClientRect(), h = Math.min(300, w._select.options.length * 38 + 14);
  w.classList.toggle('vers-le-haut', innerHeight - r.bottom < h + 12 && r.top > innerHeight - r.bottom);
  w.classList.add('ouverte');
  w.querySelector('.liste-bouton').setAttribute('aria-expanded', 'true');
  listeOuverte = w;
  activerOption(w, Math.max(0, w._select.selectedIndex), true);
  w.querySelector('.liste-menu').focus({ preventScroll: true });
  cacherTip();
}
function fermerListe(w, sansFocus = false) {
  if (!w.classList.contains('ouverte')) return;
  w.classList.remove('ouverte');
  w.querySelector('.liste-bouton').setAttribute('aria-expanded', 'false');
  if (listeOuverte === w) listeOuverte = null;
  if (!sansAnimation()) { w.classList.add('fermeture'); w._finAnim = setTimeout(() => w.classList.remove('fermeture'), 130); }
  if (!sansFocus) w.querySelector('.liste-bouton').focus({ preventScroll: true });
}
function activerOption(w, i, defiler) {
  const opts = w.querySelectorAll('.liste-option');
  opts.forEach((o, k) => o.classList.toggle('active', k === i));
  w._actif = i;
  if (defiler && opts[i]?.scrollIntoView) opts[i].scrollIntoView({ block: 'nearest' });
}
function choisirOption(w, i) {
  const sel = w._select, change = sel.selectedIndex !== i;
  sel.selectedIndex = i;
  fermerListe(w);
  synchroniserListe(w);
  if (change) {
    sel.dispatchEvent(new Event('input', { bubbles: true }));
    sel.dispatchEvent(new Event('change', { bubbles: true }));
  }
}
function naviguerListe(e, w) {
  const n = w._select.options.length;
  let i = w._actif ?? 0;
  if (e.key === 'ArrowDown') i = Math.min(n - 1, i + 1);
  else if (e.key === 'ArrowUp') i = Math.max(0, i - 1);
  else if (e.key === 'Home') i = 0;
  else if (e.key === 'End') i = n - 1;
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); return choisirOption(w, i); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); return fermerListe(w); }  // ne ferme pas la fenêtre en dessous
  else if (e.key === 'Tab') return fermerListe(w, true);
  else return;
  e.preventDefault();
  activerOption(w, i, true);
}
document.addEventListener('pointerdown', e => { if (listeOuverte && !listeOuverte.contains(e.target)) fermerListe(listeOuverte, true); });

// Fenêtres de saisie : un clic à côté ne les ferme pas (la saisie serait perdue) ; ✕, Annuler ou Échap

async function supprimerSortie(v, s, ligne) {

  const ok = await confirmer({
    titre: 'Supprimer cette sortie ?',
    message: `${v.nom}${v.millesime ? ' ' + v.millesime : ''} · sortie du ${dateFr(s.date) || 'date inconnue'}\n`
      + `${n > 1 ? `Les ${n} bouteilles seront remises` : 'La bouteille sera remise'} en stock.`,
  });

  if (ligne && !sansAnimation()) {

    ligne.classList.add('disparition');

    form.elements.dateAchat.value = new Date().toLocaleDateString('fr-FR');
  }
  photoTemp = vin ? vin.photo || null : null;
  $('#input-photo').value = '';
  majApercu();
  ouvrir('#m-form');
  synchroniserListes();
  form.elements.nom.focus();
}
$('#btn-ajouter').onclick = () => ouvrirFormulaire();
// Glisser-déposer une image sur la zone photo
const zonePhoto = $('#zone-photo');
['dragenter', 'dragover'].forEach(t => zonePhoto.addEventListener(t, e => { e.preventDefault(); zonePhoto.classList.add('survol'); }));
['dragleave', 'drop'].forEach(t => zonePhoto.addEventListener(t, () => zonePhoto.classList.remove('survol')));
zonePhoto.addEventListener('drop', async e => {
  e.preventDefault();
  const f = [...(e.dataTransfer?.files || [])].find(x => x.type.startsWith('image/'));
  if (!f) return;
  try { photoTemp = await lireImage(f); majApercu(); }
  catch { informer('Photo illisible', 'Impossible de lire cette image. Essayez une photo au format JPEG ou PNG.'); }
});
$('#input-photo').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try { photoTemp = await lireImage(f); majApercu(); }
  catch { informer('Photo illisible', 'Impossible de lire cette image. Essayez une photo au format JPEG ou PNG.'); }
};
$('#btn-retirer-photo').onclick = () => { photoTemp = null; $('#input-photo').value = ''; majApercu(); };

form.onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(form));
  const num = k => d[k] === '' ? '' : Number(d[k]);
  const vin = {
    ...(enEdition || { id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(), sorties: [], creeLe: new Date().toISOString() }),
    nom: d.nom.trim(), appellation: d.appellation.trim(), region: d.region.trim(), couleur: d.couleur,
    millesime: num('millesime'), apogee: num('apogee'), degre: num('degre'), seuil: num('seuil'),
    position: d.position.trim(), quantite: num('quantite'),
    stock: d.stock === '' ? (Number(d.quantite) || 0) : Number(d.stock),
    prix: num('prix'), dateAchat: d.dateAchat.trim(), lieuAchat: d.lieuAchat.trim(), notes: d.notes.trim(),
    photo: photoTemp,
  };
  await sauver(vin);
  fermer('#m-form');
  await recharger();
  if (enEdition && $('#m-detail').classList.contains('ouvert')) afficherDetail(vin.id);
};

// ---------- Détail ----------
function afficherDetail(id) {
  const v = vins.find(x => x.id === id);
  if (!v) return;
  vinCourant = v;
  const a = etatApogee(v);
  const sorties = [...(v.sorties || [])].sort((x, y) => (y.date || '').localeCompare(x.date || ''));
  const notees = sorties.filter(s => s.note);
  const moyenne = notees.length ? (notees.reduce((s, x) => s + x.note, 0) / notees.length).toFixed(1) : null;
  const ligne = (l, val) => `<tr><td>${l}</td><td>${val || '—'}</td></tr>`;

  $('#detail-contenu').innerHTML = `
    <h2>${hl(v.nom)} ${v.millesime ? hl(v.millesime) : ''}</h2>
    <div class="detail-tete">
      <div class="grande-photo ${v.photo ? 'photo-ok' : ''}" style="${v.photo ? `background-image:url(${v.photo})` : ''}" ${v.photo ? 'title="Agrandir la photo"' : ''}>${v.photo ? '' : '🍷'}</div>
      <div class="infos">
        <table>
          ${ligne('Appellation', hl(v.appellation))}
          ${ligne('Région', hl(v.region))}
          ${ligne('Couleur', `<span class="pastille" style="background:${couleurVin(v.couleur)}"></span>${hl(v.couleur)}`)}
          ${ligne('Millésime', hl(v.millesime))}
          ${ligne('Apogée', `${esc(v.apogee) || '—'} <span class="badge ${a.cls}">${a.txt}</span>`)}
          ${ligne('Degré', v.degre !== '' && v.degre != null ? esc(v.degre) + ' % vol.' : '')}
          ${ligne('Position', hl(v.position))}
          ${ligne('Quantité achetée', esc(v.quantite))}
          ${ligne('Stock', `<b>${stockDe(v)}</b> bouteille(s)${stockBas(v) ? ' <span class="badge b-bas">Stock bas</span>' : ''}`)}
          ${ligne("Seuil d'alerte", esc(v.seuil))}
          ${ligne("Prix d'achat", v.prix !== '' && v.prix != null ? euro(v.prix) + ' / btl' : '')}
          ${ligne('Valeur en stock', `<b>${euro(valeur(v))}</b>`)}
          ${ligne("Date d'achat", esc(dateAchatFr(v.dateAchat)))}
          ${ligne("Lieu d'achat", hl(v.lieuAchat))}
          ${moyenne ? ligne('Appréciation moyenne', `<span class="etoiles">${etoiles(Math.round(moyenne))}</span> ${moyenne}/5`) : ''}
        </table>
        ${v.notes ? `<p style="white-space:pre-wrap; font-size:.92rem">${hl(v.notes)}</p>` : ''}
      </div>
    </div>
    <div class="actions" style="justify-content:flex-start">
      <button id="d-sortir" ${stockDe(v) > 0 ? '' : 'disabled style="opacity:.5;cursor:not-allowed"'}>🍷 Sortir une bouteille</button>
      <button class="sec" id="d-modifier">Modifier</button>
      <button class="danger" id="d-supprimer">Supprimer</button>
    </div>
    <div class="sorties">
      <h3>Sorties (${sorties.reduce((s, x) => s + (x.nombre || 1), 0)})</h3>
      ${sorties.length ? sorties.map(s => `
        <div class="sortie">
          <div class="entete">
            <span>${dateFr(s.date)}${(s.nombre || 1) > 1 ? ` · ${s.nombre} bouteilles` : ''}</span>
            <span><span class="etoiles">${s.note ? etoiles(s.note) : ''}</span>
              <button class="suppr-sortie" data-sid="${s.id}" title="Annuler cette sortie (remet en stock)">✕</button></span>
          </div>
          ${s.commentaire ? `<div style="white-space:pre-wrap; margin-top:4px">${hl(s.commentaire)}</div>` : ''}
        </div>`).join('') : '<p class="sous">Aucune sortie pour le moment.</p>'}
    </div>`;

  $('#d-sortir').onclick = () => { if (stockDe(v) > 0) ouvrirSortie(); };
  $('#d-modifier').onclick = () => ouvrirFormulaire(v);
  $('#d-supprimer').onclick = async () => {
    const nbS = (v.sorties || []).length;
    const ok = await confirmer({
      titre: 'Supprimer ce vin ?',
      message: `« ${v.nom}${v.millesime ? ' ' + v.millesime : ''} » sera définitivement supprimé`
        + (nbS ? `, avec ses ${pluriel(nbS, 'sortie')}.` : '.') + '\nCette action est irréversible.',
      ok: 'Supprimer le vin',
    });
    if (!ok) return;
    await supprimer(v.id);
    fermer('#m-detail');
    recharger();
  };
  document.querySelectorAll('.suppr-sortie').forEach(b => b.onclick = async () => {
    const s = v.sorties.find(x => String(x.id) === b.dataset.sid);
    if (s && await supprimerSortie(v, s, b.closest('.sortie'))) afficherDetail(v.id);
  });
  ouvrir('#m-detail');
}

// ---------- Sortie de bouteille ----------
const formSortie = $('#form-sortie');
function majEtoiles() {
  document.querySelectorAll('#choix-etoiles span').forEach(s => s.classList.toggle('on', Number(s.dataset.n) <= noteSortie));
}
$('#choix-etoiles').addEventListener('click', e => {
  const n = Number(e.target.dataset.n);
  if (!n) return;
  noteSortie = noteSortie === n ? 0 : n;
  majEtoiles();
});
function ouvrirSortie() {
  formSortie.reset();
  formSortie.elements.date.value = aujourdhui();
  formSortie.elements.nombre.max = stockDe(vinCourant) || 1;
  noteSortie = 0; majEtoiles();
  ouvrir('#m-sortie');
}
formSortie.onsubmit = async e => {
  e.preventDefault();
  const v = vinCourant;
  const nombre = Math.min(Number(formSortie.elements.nombre.value) || 1, stockDe(v));
  if (nombre < 1) return;
  v.sorties = v.sorties || [];
  v.sorties.push({
    id: String(Date.now()) + Math.random().toString(36).slice(2),
    date: formSortie.elements.date.value, nombre, note: noteSortie,
    commentaire: formSortie.elements.commentaire.value.trim(),
  });
  v.stock = stockDe(v) - nombre;
  await sauver(v);
  fermer('#m-sortie');
  await recharger();
  afficherDetail(v.id);
};

// ---------- Filtres ----------
$('#f-tri').addEventListener('input', () => { triDesc = ['valeur', 'stock', 'prix'].includes($('#f-tri').value); afficher(); });
['#recherche', '#f-couleur', '#f-region', '#f-epuises', '#f-bas'].forEach(s => $(s).addEventListener('input', afficher));

// ---------- Téléchargement de fichier (export de l'historique) ----------
function telecharger(contenu, nom, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenu], { type }));
  a.download = nom;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// ---------- Démarrage ----------
// Import automatique des données de cave.xlsx, une seule fois par navigateur
async function importInitial() {
  const d = window.DONNEES_INITIALES;
  if (!d || !Array.isArray(d.vins) || localStorage.getItem('import-initial-fait')) return;
  const existants = new Set((await toutLire()).map(v => v.id));
  for (const v of d.vins) if (!existants.has(v.id)) await sauver(v);
  localStorage.setItem('import-initial-fait', new Date().toISOString());
}

// Le n° de référence (colonne ID de l'Excel) n'est plus utilisé : on le retire des fiches existantes
async function retirerReferences() {
  for (const v of await toutLire()) if ('ref' in v) { delete v.ref; await sauver(v); }
}

if (window.Capacitor?.Plugins?.App) {
  window.Capacitor.Plugins.App.addListener('backButton', () => {
    if ($('#visionneuse').classList.contains('ouvert')) return fermerPhoto();
    const m = modaleDuDessus();
    if (m) return fermerElement(m);
    if (vue === 'carte' && regionSel) { regionSel = null; appSel = null; return afficher(); }
    if (vue !== 'dashboard') return changerVue('dashboard');
    window.Capacitor.Plugins.App.exitApp();
  });
}

if (!['dashboard', 'lignes', 'carte', 'historique'].includes(vue)) vue = 'dashboard';
ouvrirDB().then(importInitial).then(retirerReferences).then(recharger).catch(err => informer('Erreur de base de données', String(err)));
</script>
</body>
</html>
